<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Remote Console</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --surface-2: #f1f3f8;
            --border: #e4e7ef;
            --text: #1f2333;
            --text-2: #6b7280;
            --text-3: #9ca3af;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --accent-soft: #eef0ff;
            --danger: #ef4444;
            --danger-soft: #fee2e2;
            --success: #10b981;
            --warning: #f59e0b;
            --top-btn-red: #fca5a5;
            --top-btn-green: #86efac;
            --top-btn-blue: #93c5fd;
            --user-bubble: #eef0ff;
            --ai-bubble: #ffffff;
            --result-bg: #eef1f7;
            --result-text: #334155;
            --result-border: #d5dbe8;
            --result-inner: #e2e7f1;
            --result-hi: rgba(255, 255, 255, 0.7);
            --shadow: 0 10px 30px rgba(31, 35, 51, 0.08);
            --shadow-sm: 0 2px 8px rgba(31, 35, 51, 0.06);
        }
        [data-theme="dark"] {
            --bg: #0f1117;
            --surface: #171a21;
            --surface-2: #1e222b;
            --border: #2a2f3a;
            --text: #e7e9ee;
            --text-2: #9aa3b2;
            --text-3: #6b7280;
            --accent: #818cf8;
            --accent-2: #a78bfa;
            --accent-soft: #232741;
            --danger: #f87171;
            --danger-soft: #3a2226;
            --success: #34d399;
            --warning: #fbbf24;
            --top-btn-red: #7f1d1d;
            --top-btn-green: #14532d;
            --top-btn-blue: #1e3a8a;
            --user-bubble: #232741;
            --ai-bubble: #1e222b;
            --result-bg: #11141b;
            --result-text: #c7d2e3;
            --result-border: #262d3d;
            --result-inner: #0b0e14;
            --result-hi: rgba(255, 255, 255, 0.05);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        /* ---------- Header ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
            height: 60px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 50;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .brand .logo {
            width: 30px; height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }
        .spacer { flex: 1; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: var(--accent-soft);
            color: var(--accent);
            white-space: nowrap;
        }
        .badge .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: currentColor;
        }
        .badge.success { color: var(--success); background: rgba(16, 185, 129, 0.12); }
        .badge.danger { color: var(--danger); background: var(--danger-soft); }
        .top-actions { display: flex; gap: 8px; }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px; height: 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            font-family: inherit;
        }
        .icon-btn:hover { background: var(--surface-2); border-color: var(--text-3); }
        .icon-btn:active { transform: scale(0.95); }
        .icon-btn svg { width: 18px; height: 18px; }

        /* ---------- Agent sidebar (left) ---------- */
        .agent-sidebar {
            position: fixed;
            top: 60px; left: 0; bottom: 0;
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform: translateX(-100%);
            transition: transform 0.28s ease;
            z-index: 55;
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }
        .agent-sidebar.visible { transform: translateX(0); }
        .agent-sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-3);
            margin: 0 16px 10px;
            font-weight: 600;
        }
        .agent-sidebar .agent-list { flex: 1; overflow-y: auto; }
        .agent-item {
            padding: 10px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.12s;
        }
        .agent-item:hover { background: var(--surface-2); }
        .agent-item.active {
            background: var(--accent-soft);
            border-left-color: var(--accent);
        }
        .agent-item .aid { font-weight: 600; font-size: 13.5px; color: var(--text); word-break: break-all; }
        .agent-item .host { font-size: 12px; color: var(--text-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .agent-item .os { font-size: 11px; color: var(--text-3); margin-top: 1px; }
        .agent-sidebar .agent-empty {
            padding: 24px 16px;
            text-align: center;
            color: var(--text-3);
            font-size: 13px;
        }
        .agent-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 17, 23, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 49;
        }
        .agent-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        @media (min-width: 720px) {
            .agent-backdrop { display: none; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }
        .btn:hover { background: var(--surface-2); border-color: var(--text-3); }
        .btn:active { transform: scale(0.97); }
        .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .btn.small svg { width: 14px; height: 14px; }
        .btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none; color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn.primary:hover { opacity: 0.92; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
        .btn.danger { background: var(--danger); border: none; color: #fff; }
        .btn.danger:hover { opacity: 0.9; }
        .btn.ghost { background: transparent; }
        .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ---------- Command panel ---------- */
        .command-panel {
            height: 0;
            overflow: hidden;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            transition: height 0.25s ease, margin-left 0.28s ease;
            flex-shrink: 0;
        }
        .command-panel.visible { height: 64px; }
        .command-panel-inner {
            display: flex;
            align-items: stretch;
            gap: 10px;
            padding: 12px 20px;
        }
        .command-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .command-input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .command-input-wrap svg {
            width: 15px;
            height: 15px;
            color: var(--text-3);
            flex-shrink: 0;
        }
        .command-input-wrap input {
            flex: 1;
            min-width: 0;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        .command-input-wrap input:focus { outline: none; }
        .command-input-wrap input::placeholder { color: var(--text-3); }
        .text-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        .text-input:focus { outline: none; border-color: var(--accent); }

        /* ---------- Main ---------- */
        .main { flex: 1; display: flex; overflow: hidden; position: relative; transition: margin-left 0.28s ease; }
        body.agent-sidebar-open .main { margin-left: 260px; }
        body.agent-sidebar-open .command-panel { margin-left: 260px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
        }
        .chat-inner {
            width: 100%;
            padding: 0 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        .msg.system {
            align-self: center;
            max-width: 92%;
            background: var(--surface-2);
            color: var(--text-2);
            font-size: 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .msg.result {
            align-self: flex-start;
            max-width: 96%;
            background: var(--result-bg);
            color: var(--result-text);
            font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            border: 1px solid var(--result-border);
            border-radius: 10px;
            border-top-left-radius: 4px;
            box-shadow: inset 0 1px 0 var(--result-hi);
        }
        .msg.result .cmd-block {
            background: var(--result-inner);
            border: none;
            box-shadow: inset 0 1px 0 var(--result-hi);
        }
        .msg .cmd-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 8px;
            font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
            font-size: 12.5px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .collapsible-content { max-height: 220px; overflow: hidden; position: relative; transition: max-height 0.3s; }
        .collapsible-content.expanded { max-height: none; }
        .collapsible-content::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
            background: linear-gradient(transparent, var(--surface-2)); pointer-events: none;
        }
        .collapsible-content.expanded::after { display: none; }
        .msg.result .collapsible-content::after {
            background: linear-gradient(transparent, var(--result-bg));
        }
        .collapsible-toggle { display: none; margin-top: 6px; }
        .collapsible-toggle.show { display: inline-flex; }

        .typing {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            font-size: 13px;
        }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-3);
            animation: bounce 1.3s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        .typing.hidden { display: none; }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 14px 28px 18px;
            width: 100%;
        }
        .composer textarea {
            flex: 1;
            resize: none;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            max-height: 140px;
            box-shadow: var(--shadow-sm);
        }
        .composer textarea:focus { outline: none; border-color: var(--accent); }
        .composer .send-btn {
            align-self: stretch;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.15s, opacity 0.15s;
            flex-shrink: 0;
        }
        .composer .send-btn:hover { opacity: 0.9; }
        .composer .send-btn:active { transform: scale(0.92); }
        .composer .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .send-btn svg { width: 18px; height: 18px; }
        .composer .send-btn.stop {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
        }

        /* ---------- Files panel ---------- */
        .files-panel {
            position: absolute;
            inset: 0;
            background: var(--bg);
            z-index: 40;
            display: none;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
        }
        .files-panel.visible { display: flex; }
        .files-head { display: flex; align-items: center; gap: 10px; }
        .files-head h2 { font-size: 15px; font-weight: 600; }
        .files-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .files-path-row { display: flex; gap: 8px; }
        .files-path-row .text-input { flex: 1; }
        .files-list {
            flex: 1;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
        }
        .file-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.12s;
        }
        .file-row:last-child { border-bottom: none; }
        .file-row:hover { background: var(--surface-2); }
        .file-row.selected { background: var(--accent-soft); }
        .file-icon { font-size: 17px; width: 24px; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
        .file-icon svg { width: 20px; height: 20px; }
        .file-name { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { font-size: 12px; color: var(--text-3); }
        .files-empty { padding: 40px; text-align: center; color: var(--text-3); font-size: 13px; }

        /* ---------- Controls drawer ---------- */
        .drawer {
            position: fixed;
            top: 60px; right: 0; bottom: 0;
            width: 300px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform: translateX(100%);
            transition: transform 0.28s ease;
            z-index: 60;
            padding: 24px;
            overflow-y: auto;
        }
        .drawer.visible { transform: translateX(0); }
        .drawer h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-3);
            margin: 20px 0 12px;
            font-weight: 600;
        }
        .drawer h3:first-child { margin-top: 0; }
        .drawer .divider { height: 1px; background: var(--border); margin: 20px 0; }
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13.5px; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
        .status-dot.authorized { background: var(--success); }
        .drawer .btn { width: 100%; margin-top: 8px; }

        /* ---------- Modal ---------- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 17, 23, 0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-card {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 24px;
            width: 92%;
            max-width: 540px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal-card h3 { font-size: 16px; margin-bottom: 6px; }
        .modal-card .sub { color: var(--text-2); font-size: 13px; margin-bottom: 16px; }
        .modal-commands { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; max-height: 320px; overflow-y: auto; }
        .modal-cmd-item { padding: 10px; border-bottom: 1px solid var(--border); }
        .modal-cmd-item:last-child { border-bottom: none; }
        .cmd-action { font-weight: 600; font-size: 13.5px; color: var(--accent); }
        .cmd-params { font-size: 12.5px; color: var(--text-2); margin-top: 4px; font-family: monospace; white-space: pre-wrap; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

        /* ---------- Generic modal (file input) ---------- */
        .modal-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font-size: 14px; margin: 14px 0; }
        .modal-input:focus { outline: none; border-color: var(--accent); }
        .radio-group { display: flex; gap: 20px; margin: 12px 0; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        .radio-group input { cursor: pointer; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: rgba(239, 68, 68, 0.4);
            color: var(--danger);
        }

        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
        ::-webkit-scrollbar-track { background: transparent; }

        @media (max-width: 720px) {
            .top-actions .btn span.lbl { display: none; }
            .top-actions .btn {
                width: 52px;
                height: 28px;
                padding: 0;
                border-radius: 999px;
                border-color: transparent;
            }
            #commandToggleBtn { background: var(--top-btn-red); }
            #filesToggleBtn { background: var(--top-btn-green); }
            #sidebarToggleBtn { background: var(--top-btn-blue); }
            .chat-inner { padding: 0 14px; }
            .composer { padding: 12px 14px 16px; }
            body.agent-sidebar-open .main { margin-left: 0; }
            body.agent-sidebar-open .command-panel { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <button class="icon-btn" id="agentSidebarToggle" title="Toggle agents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </button>
        <div class="brand">
            <div class="logo">AI</div>
            <span>Command &amp; Control</span>
        </div>
        <span class="spacer"></span>
        <div class="top-actions">
            <button class="btn" id="commandToggleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h6"/><path d="M7 12h4"/><path d="M7 16h8"/></svg><span class="lbl">Command</span></button>
            <button class="btn" id="filesToggleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Files</span></button>

                <button class="btn small" id="filesParentBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Parent</button>

            <button class="btn danger" id="shutdownBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>Shutdown Agent</button>

    <!-- Auth modal -->
    <div class="modal" id="cmdModal">
        <div class="modal-card">
            <h3>Command Authorization</h3>

        <div class="modal-card">

            <input type="text" class="modal-input" id="filesModalInput" placeholder="Enter name..." value="New">

    <!-- Path input modal (copy/move) -->
    <div class="modal" id="filesPathModal">
        <div class="modal-card">
            <h3 id="filesPathModalTitle">Copy / Move</h3>
            <input type="text" class="modal-input" id="filesPathModalInput" placeholder="Enter destination path...">
            <div class="modal-actions">
                <button class="btn" id="filesPathModalCancel">Cancel</button>
                <button class="btn primary" id="filesPathModalConfirm">Confirm</button>
            </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        let pendingCommand = null;
        let conversationActive = false;

        let toastTimer = null;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.toggle('error', isError);
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        const chatBox = document.getElementById('chatBox');
        const chatScroll = document.getElementById('chatScroll');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const cmdModal = document.getElementById('cmdModal');
        const modalCommands = document.getElementById('modalCommands');
        const authDot = document.getElementById('authDot');
        const authStatus = document.getElementById('authStatus');
        const authToggle = document.getElementById('authToggle');
        const authToggleText = authToggle.querySelector('.lbl');
        const resetBtn = document.getElementById('resetBtn');
        const sidebar = document.getElementById('sidebar');
        const filesPanel = document.getElementById('filesPanel');
        let autoScrollEnabled = true;

        const SEND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
        const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';
        const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
        const DIR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
        const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>';
        const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

        function setSendButtonIdle() {
            sendBtn.disabled = false;
            sendBtn.classList.remove('stop');
            sendBtn.innerHTML = SEND_ICON;
            sendBtn.title = 'Send';
        }

        function setSendButtonStop() {
            sendBtn.disabled = false;
            sendBtn.classList.add('stop');
            sendBtn.innerHTML = STOP_ICON;
            sendBtn.title = 'Stop response';
        }

        function setSendButtonStopping() {
            sendBtn.disabled = true;
            sendBtn.classList.add('stop');
            sendBtn.innerHTML = STOP_ICON;
            sendBtn.title = 'Stopping...';
        }

        async function requestStop() {
            if (!conversationActive) return;
            setSendButtonStopping();
            try {
                await fetch('/api/stop', { method: 'POST' });
            } catch (err) {
                addMessage('Failed to send stop request: ' + err.message, 'system');
                setSendButtonStop();
            }
        }

        // ---------------- config / agents ----------------
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                updateAuthUI(config.auth_mode);
            } catch (e) {}
            await loadAgents();
            await loadHistory();
        }

        async function loadAgents() {
            try {
                const res = await fetch('/api/agents');
                const data = await res.json();
                const list = document.getElementById('agentList');
                list.innerHTML = '';
                if (!data.agents || data.agents.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'agent-empty';
                    empty.textContent = 'No agents online';
                    list.appendChild(empty);
                    return;
                }
                data.agents.forEach(a => {
                    const item = document.createElement('div');
                    item.className = 'agent-item' + (a.id === data.active ? ' active' : '');

                    const idDiv = document.createElement('div');
                    idDiv.className = 'aid';
                    idDiv.textContent = a.id;

                    const hostDiv = document.createElement('div');
                    hostDiv.className = 'host';
                    hostDiv.textContent = a.hostname;

                    const osDiv = document.createElement('div');
                    osDiv.className = 'os';
                    osDiv.textContent = a.os;

                    item.appendChild(idDiv);
                    item.appendChild(hostDiv);
                    item.appendChild(osDiv);

                    item.addEventListener('click', async () => {
                        if (a.id !== data.active) await switchAgent(a.id);
                    });
                    list.appendChild(item);
                });
            } catch (e) {
                console.warn('loadAgents failed', e);
            }
        }

        async function switchAgent(agentId) {
            if (!agentId) return;
            const formData = new FormData();
            formData.append('agent_id', agentId);
            const res = await fetch('/api/agents/switch', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                await loadAgents();
                await loadHistory();
            } else {
                addMessage('Switch failed: ' + (data.error || 'unknown'), 'system');
            }
        }

        function isResultEntry(role, content) {
            if (role !== 'user') return false;
            if (!content) return false;
            return content.startsWith('Command execution result:') ||
                   content.startsWith('JSON parse error occurred') ||
                   content.startsWith('[Network Error]') ||
                   content.startsWith('User denied command execution');
        }

        async function loadHistory() {
            chatBox.innerHTML = '';
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const history = data.history || [];
                history.forEach(item => {
                    if (item && item.content) {
                        let type;
                        if (isResultEntry(item.role, item.content)) {
                            type = 'result';
                        } else {
                            type = item.role === 'user' ? 'user' : 'ai';
                        }
                        addMessage(item.content, type);
                    }
                });
            } catch (e) {
                console.warn('loadHistory failed', e);
            }
            chatBox.appendChild(typingIndicator);
            chatScroll.scrollTop = chatScroll.scrollHeight;
        }

        function updateAuthUI(authMode) {
            const isAuto = authMode === 1;
            if (isAuto) {
                authDot.classList.add('authorized');
                authStatus.textContent = 'Auto Authorized';
                authToggleText.textContent = 'Require Authorization';
            } else {
                authDot.classList.remove('authorized');
                authStatus.textContent = 'Authorization Required';
                authToggleText.textContent = 'Enable Auto Auth';
            }
        }

        // ---------------- chat ----------------
        function addMessage(content, type, commands = null) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            let displayText = String(content ?? '');

            if (commands && commands.length > 0) {
                const parts = displayText.split(/(```json\n?[\s\S]*?```)/g);
                parts.forEach(part => {
                    if (part.match(/^```json\n?([\s\S]*?)```$/)) {
                        const json = part.replace(/^```json\n?([\s\S]*?)```$/, '$1');
                        const cmdDiv = document.createElement('div');
                        cmdDiv.className = 'cmd-block';
                        try {
                            const obj = JSON.parse(json);
                            cmdDiv.textContent = 'Action: ' + obj.action + '\n' + JSON.stringify(obj, null, 2);
                        } catch {
                            cmdDiv.textContent = json;
                        }
                        div.appendChild(cmdDiv);
                    } else {
                        const span = document.createElement('span');
                        span.textContent = part;
                        div.appendChild(span);
                    }
                });
            } else {
                const span = document.createElement('span');
                span.textContent = displayText;
                div.appendChild(span);
            }

            if ((type === 'system' || type === 'result') && displayText.length > 500) {
                const wrapper = document.createElement('div');
                const inner = document.createElement('div');
                inner.className = 'collapsible-content';
                while (div.firstChild) inner.appendChild(div.firstChild);
                wrapper.appendChild(inner);
                const toggle = document.createElement('button');
                toggle.className = 'btn small ghost collapsible-toggle show';
                toggle.textContent = 'Show more';
                toggle.onclick = () => {
                    const expanded = inner.classList.toggle('expanded');
                    toggle.textContent = expanded ? 'Show less' : 'Show more';
                };
                wrapper.appendChild(toggle);
                div.appendChild(wrapper);
            }

            chatBox.appendChild(div);
            if (autoScrollEnabled) chatScroll.scrollTop = chatScroll.scrollHeight;
        }

        const typingIndicator = document.createElement('div');
        typingIndicator.className = 'typing hidden';
        typingIndicator.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div><span class="typing-text">AI is thinking...</span>';
        chatBox.appendChild(typingIndicator);

        function setTyping(text, show) {
            if (show) {
                typingIndicator.querySelector('.typing-text').textContent = text;
                typingIndicator.classList.remove('hidden');
            } else {
                typingIndicator.classList.add('hidden');
            }
        }

        function createAiMessageBlock() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            const span = document.createElement('span');
            span.textContent = '';
            div.appendChild(span);
            chatBox.appendChild(div);
            return span;
        }

        async function sendMessage() {
            const msg = messageInput.value.trim();
            if (!msg || conversationActive) return;
            autoScrollEnabled = true;
            conversationActive = true;
            setSendButtonStop();
            addMessage(msg, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';

            let aiSpan = createAiMessageBlock();

            pendingCommand = null;

            try {
                const formData = new FormData();
                formData.append('message', msg);
                const res = await fetch('/api/chat-stream', { method: 'POST', body: formData });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            switch (data.type) {
                                case 'answering':
                                    setTyping(`AI is thinking... (Round ${data.iteration})`, true);
                                    if (data.iteration > 1) aiSpan = createAiMessageBlock();
                                    break;
                                case 'chunk':
                                    aiSpan.textContent += data.content;
                                    if (autoScrollEnabled) chatScroll.scrollTop = chatScroll.scrollHeight;
                                    break;
                                case 'response_done':
                                    setTyping('', false);
                                    break;
                                case 'auth_required':
                                    setTyping('', false);
                                    pendingCommand = data.commands[0];
                                    break;
                                case 'waiting_auth':
                                    showCommandModal(pendingCommand);
                                    break;
                                case 'executing':
                                    setTyping('Executing commands...', true);
                                    break;
                                case 'execution_done':
                                    setTyping('', false);
                                    if (data.results) {
                                        for (const ex of data.results) {
                                            let info = '';
                                            if (ex.action === 'exec_cmd' && ex.params && ex.params.command) info = ` [${ex.params.command}]`;
                                            else if (ex.params && ex.params.path) info = ` [${ex.params.path}]`;
                                            addMessage(`[${ex.action}]${info}\n${ex.result}`, 'result');
                                        }
                                    }
                                    break;
                                case 'stopped':
                                    cmdModal.classList.remove('show');
                                    pendingCommand = null;
                                    aiSpan.textContent += '\n[Stopped by user]';
                                    setTyping('', false);
                                    break;
                                case 'done':
                                    pendingCommand = null;
                                    break;
                                case 'error':
                                    aiSpan.textContent += `\n[Error: ${data.error}]`;
                                    setTyping('', false);
                                    break;
                                case 'auth_denied':
                                    addMessage(data.message || 'Authorization denied', 'system');
                                    break;
                            }
                        } catch (e) {}
                    }
                }
                setTyping('', false);
                await loadConfig();
            } catch (err) {
                addMessage('Error: ' + err.message, 'system');
                setTyping('', false);
            } finally {
                pendingCommand = null;
                conversationActive = false;
                setSendButtonIdle();
                cmdModal.classList.remove('show');
            }
        }

        function showCommandModal(cmd) {
            modalCommands.innerHTML = '';
            if (cmd) {
                const item = document.createElement('div');
                item.className = 'modal-cmd-item';
                const action = document.createElement('div');
                action.className = 'cmd-action';
                action.textContent = cmd.action;
                const params = document.createElement('div');
                params.className = 'cmd-params';
                params.textContent = JSON.stringify(cmd, null, 2);
                item.appendChild(action);
                item.appendChild(params);
                modalCommands.appendChild(item);
            }
            cmdModal.classList.add('show');
        }

        async function submitAuth(authorized) {
            cmdModal.classList.remove('show');
            const cmd = pendingCommand;
            try {
                const formData = new FormData();
                formData.append('authorized', authorized ? 'true' : 'false');
                formData.append('commands', JSON.stringify(authorized && cmd ? [cmd] : []));
                await fetch('/api/authorize-execute', { method: 'POST', body: formData });
            } catch (err) {
                addMessage('Error: ' + err.message, 'system');
            } finally {
                pendingCommand = null;
            }
        }

        // ---------------- events ----------------
        sendBtn.addEventListener('click', () => {
            if (conversationActive) {
                requestStop();
            } else {
                sendMessage();
            }
        });
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
        });

        document.getElementById('modalDeny').addEventListener('click', async () => {
            addMessage('Command execution denied by user.', 'system');
            await submitAuth(false);
        });
        document.getElementById('modalAuthorize').addEventListener('click', async () => {
            await submitAuth(true);
        });

        authToggle.addEventListener('click', async () => {
            const currentMode = document.getElementById('authStatus').textContent;
            const newMode = currentMode.includes('Required') ? '1' : '0';
            const formData = new FormData();
            formData.append('mode', newMode);
            await fetch('/api/set-auth', { method: 'POST', body: formData });
            await loadConfig();
        });

        resetBtn.addEventListener('click', async () => {
            await fetch('/api/reset', { method: 'POST' });
            await loadConfig();
            addMessage('Conversation reset.', 'system');
        });

        document.getElementById('shutdownBtn').addEventListener('click', async () => {
            if (!confirm('Shut down the active Agent? It will disconnect and exit.')) return;
            try {
                const res = await fetch('/api/shutdown', { method: 'POST' });
                const data = await res.json();
                addMessage(data.success ? `Shutdown command sent to ${data.agent}.` : ('Shutdown failed: ' + (data.error || 'unknown')), 'system');
            } catch (err) {
                addMessage('Error: ' + err.message, 'system');
            }
        });

        setInterval(loadAgents, 5000);

        // ---------------- agent sidebar (left) ----------------
        let agentSidebarOpen = true;
        let wasNarrow = window.innerWidth < 720;

        function applyAgentSidebarState() {
            const sidebar = document.getElementById('agentSidebar');
            const backdrop = document.getElementById('agentSidebarBackdrop');
            const narrow = window.innerWidth < 720;
            sidebar.classList.toggle('visible', agentSidebarOpen);
            document.body.classList.toggle('agent-sidebar-open', agentSidebarOpen);
            backdrop.classList.toggle('show', narrow && agentSidebarOpen);
        }

        document.getElementById('agentSidebarToggle').addEventListener('click', () => {
            agentSidebarOpen = !agentSidebarOpen;
            applyAgentSidebarState();
        });

        document.getElementById('agentSidebarBackdrop').addEventListener('click', () => {
            agentSidebarOpen = false;
            applyAgentSidebarState();
        });

        window.addEventListener('resize', () => {
            const narrow = window.innerWidth < 720;
            if (narrow && !wasNarrow) {
                agentSidebarOpen = false; // auto-collapse when entering narrow
            } else if (!narrow && wasNarrow) {
                agentSidebarOpen = true;  // restore default open when entering desktop
            }
            wasNarrow = narrow;
            applyAgentSidebarState();
        });
        applyAgentSidebarState();

        // ---------------- theme ----------------
        const themeToggle = document.getElementById('themeToggle');
        const themeToggleIcon = themeToggle.querySelector('svg');
        const themeToggleText = themeToggle.querySelector('.lbl');
        function setTheme(dark) {
            if (dark) {
                document.body.setAttribute('data-theme', 'dark');
                themeToggleIcon.innerHTML = MOON_ICON;
                themeToggleText.textContent = 'Switch to Light Mode';
            } else {
                document.body.removeAttribute('data-theme');
                themeToggleIcon.innerHTML = SUN_ICON;
                themeToggleText.textContent = 'Switch to Dark Mode';
            }
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }
        themeToggle.addEventListener('click', () => {
            setTheme(document.body.getAttribute('data-theme') !== 'dark');
        });
        if (localStorage.getItem('theme') === 'dark') setTheme(true);

        chatScroll.addEventListener('scroll', () => {
            const atBottom = chatScroll.scrollHeight - chatScroll.clientHeight - chatScroll.scrollTop < 50;
            autoScrollEnabled = atBottom;
        });

        // ---------------- panels ----------------
        const commandPanel = document.getElementById('commandPanel');
        const commandInput = document.getElementById('commandInput');
        const commandExecuteBtn = document.getElementById('commandExecuteBtn');

        function closeAllPanels() {
            sidebar.classList.remove('visible');
            commandPanel.classList.remove('visible');
            filesPanel.classList.remove('visible');
        }

        document.getElementById('sidebarToggleBtn').addEventListener('click', () => {
            const isOpen = sidebar.classList.contains('visible');
            closeAllPanels();
            if (!isOpen) sidebar.classList.add('visible');
        });

        document.getElementById('commandToggleBtn').addEventListener('click', () => {
            const isOpen = commandPanel.classList.contains('visible');
            closeAllPanels();
            if (!isOpen) {
                commandPanel.classList.add('visible');
                commandInput.focus();
            }
        });

        document.getElementById('filesToggleBtn').addEventListener('click', () => {
            const isOpen = filesPanel.classList.contains('visible');
            closeAllPanels();
            if (!isOpen) {
                filesPanel.classList.add('visible');
                loadFilesList();
            }
        });

        // ---------------- file manager ----------------
        const filesList = document.getElementById('filesList');
        const filesPathInput = document.getElementById('filesPathInput');
        const filesModal = document.getElementById('filesModal');
        const filesModalTitle = document.getElementById('filesModalTitle');
        const filesModalInput = document.getElementById('filesModalInput');
        const filesModalConfirm = document.getElementById('filesModalConfirm');
        const filesModalCancel = document.getElementById('filesModalCancel');
        const filesUploadInput = document.getElementById('filesUploadInput');
        const filesPathModal = document.getElementById('filesPathModal');
        const filesPathModalTitle = document.getElementById('filesPathModalTitle');
        const filesPathModalInput = document.getElementById('filesPathModalInput');
        const filesPathModalConfirm = document.getElementById('filesPathModalConfirm');
        const filesPathModalCancel = document.getElementById('filesPathModalCancel');

        let selectedFile = null;
        let filesModalCallback = null;
        let filesPathModalCallback = null;

        async function loadFilesList() {
            try {
                const res = await fetch('/api/files/list');
                const data = await res.json();
                if (data.error) {
                    filesPathInput.value = 'Error: ' + data.error;
                    filesList.innerHTML = '';
                    return;
                }
                filesPathInput.value = data.current_path;
                filesList.innerHTML = '';
                selectedFile = null;

                if (!data.items || data.items.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'files-empty';
                    empty.textContent = 'Empty directory';
                    filesList.appendChild(empty);
                    return;
                }

                data.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'file-row';
                    div.dataset.name = item.name;
                    div.dataset.isDir = item.is_dir;
                    const iconColor = item.is_dir ? 'var(--warning)' : 'var(--text-3)';
                    div.innerHTML = `
                        <span class="file-icon" style="color: ${iconColor};">${item.is_dir ? DIR_ICON : FILE_ICON}</span>
                        <span class="file-name"></span>
                        <span class="file-size">${item.is_dir ? '' : formatSize(item.size)}</span>
                    `;
                    div.querySelector('.file-name').textContent = item.name;
                    div.addEventListener('click', () => selectFile(div, item));
                    div.addEventListener('dblclick', async () => {
                        if (item.is_dir) await enterDir(item.name);
                    });
                    filesList.appendChild(div);
                });
            } catch (err) {
                filesPathInput.value = 'Error: ' + err.message;
            }
        }

        async function enterDir(name) {
            const formData = new FormData();
            formData.append('dirname', name);
            const res = await fetch('/api/files/chdir', { method: 'POST', body: formData });
            const result = await res.json();
            if (result.error) filesPathInput.value = 'Error: ' + result.error;
            else await loadFilesList();
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(1) + ' GB';
        }

        function selectFile(element, item) {
            document.querySelectorAll('.file-row.selected').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedFile = item;
        }

        document.getElementById('filesRefreshBtn').addEventListener('click', loadFilesList);
        document.getElementById('filesParentBtn').addEventListener('click', async () => {
            const res = await fetch('/api/files/parent', { method: 'POST' });
            const data = await res.json();
            if (data.error) filesPathInput.value = 'Error: ' + data.error;
            else await loadFilesList();
        });

        document.getElementById('filesAccessBtn').addEventListener('click', async () => {
            const path = filesPathInput.value.trim();
            if (!path) { filesPathInput.value = 'Error: Please enter a path'; return; }
            await enterDir(path);
        });
        filesPathInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('filesAccessBtn').click(); });

        document.getElementById('filesNewBtn').addEventListener('click', () => {
            filesModalTitle.textContent = 'New';
            filesModalInput.value = 'New';
            document.querySelector('input[name="filesModalType"][value="file"]').checked = true;
            filesModalConfirm.textContent = 'Create';
            filesModalCallback = async () => {
                const name = filesModalInput.value.trim() || 'New';
                const type = document.querySelector('input[name="filesModalType"]:checked').value;
                const formData = new FormData();
                if (type === 'file') {
                    formData.append('filename', name);
                    await fetch('/api/files/new', { method: 'POST', body: formData });
                } else {
                    formData.append('dirname', name);
                    await fetch('/api/files/mkdir', { method: 'POST', body: formData });
                }
                await loadFilesList();
            };
            filesModal.classList.add('show');
            filesModalInput.focus();
            filesModalInput.select();
        });

        document.getElementById('filesDeleteBtn').addEventListener('click', async () => {
            if (!selectedFile) { alert('Please select a file or directory to delete.'); return; }
            if (!confirm(`Delete "${selectedFile.name}"?`)) return;
            const formData = new FormData();
            formData.append('filepath', filesPathInput.value + '/' + selectedFile.name);
            const res = await fetch('/api/files/delete', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.error) alert('Error: ' + data.error);
            else await loadFilesList();
        });

        document.getElementById('filesUploadBtn').addEventListener('click', () => filesUploadInput.click());
        filesUploadInput.addEventListener('change', async () => {
            const file = filesUploadInput.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            const base = filesPathInput.value;
            formData.append('dest', (base && !base.startsWith('Error')) ? base + '/' + file.name : file.name);
            const res = await fetch('/api/files/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.error) {
                alert('Error: ' + data.error);
            } else {
                addMessage(data.result, 'system');
                showToast('Uploaded: ' + file.name);
                await loadFilesList();
            }
            filesUploadInput.value = '';
        });

        document.getElementById('filesDownloadBtn').addEventListener('click', async () => {
            if (!selectedFile || selectedFile.is_dir) { alert('Please select a file to download.'); return; }
            const path = filesPathInput.value + '/' + selectedFile.name;
            try {
                const res = await fetch('/api/files/download?src=' + encodeURIComponent(path));
                const data = await res.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    addMessage(data.result, 'system');
                    showToast('Downloaded: ' + selectedFile.name);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        filesModalCancel.addEventListener('click', () => filesModal.classList.remove('show'));
        filesModalConfirm.addEventListener('click', () => {
            if (filesModalCallback) filesModalCallback();
            filesModal.classList.remove('show');
        });
        filesModalInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') filesModalConfirm.click(); });

        function openPathModal(title, srcPath, confirmText, callback) {
            filesPathModalTitle.textContent = title;
            filesPathModalInput.value = srcPath;
            filesPathModalConfirm.textContent = confirmText;
            filesPathModalCallback = callback;
            filesPathModal.classList.add('show');
            filesPathModalInput.focus();
            filesPathModalInput.select();
        }

        document.getElementById('filesCopyBtn').addEventListener('click', () => {
            if (!selectedFile) { alert('Please select a file or directory to copy.'); return; }
            const srcPath = filesPathInput.value + '/' + selectedFile.name;
            openPathModal('Copy: ' + selectedFile.name, srcPath, 'Copy', async (destPath) => {
                if (!destPath) { alert('Please enter a destination path.'); return; }
                const formData = new FormData();
                formData.append('src', srcPath);
                formData.append('dest', destPath);
                const res = await fetch('/api/files/copy', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.error) alert('Error: ' + data.error);
                else await loadFilesList();
            });
        });

        document.getElementById('filesMoveBtn').addEventListener('click', () => {
            if (!selectedFile) { alert('Please select a file or directory to move.'); return; }
            const srcPath = filesPathInput.value + '/' + selectedFile.name;
            openPathModal('Move: ' + selectedFile.name, srcPath, 'Move', async (destPath) => {
                if (!destPath) { alert('Please enter a destination path.'); return; }
                const formData = new FormData();
                formData.append('src', srcPath);
                formData.append('dest', destPath);
                const res = await fetch('/api/files/move', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.error) alert('Error: ' + data.error);
                else await loadFilesList();
            });
        });

        filesPathModalCancel.addEventListener('click', () => filesPathModal.classList.remove('show'));
        filesPathModalConfirm.addEventListener('click', () => {
            const value = filesPathModalInput.value.trim();
            if (filesPathModalCallback) filesPathModalCallback(value);
            filesPathModal.classList.remove('show');
        });
        filesPathModalInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') filesPathModalConfirm.click(); });

        // ---------------- direct command ----------------
        async function executeDirectCommand(cmd) {
            try {
                const formData = new FormData();
                formData.append('command', cmd);
                const res = await fetch('/api/exec-cmd', { method: 'POST', body: formData });
                const data = await res.json();
                return data.error ? `[exec_cmd] [${cmd}]\nError: ${data.error}` : `[exec_cmd] [${cmd}]\n${data.result}`;
            } catch (err) {
                return `[exec_cmd] [${cmd}]\nError: ${err.message}`;
            }
        }

        async function sendDirectCommand() {
            const cmd = commandInput.value.trim();
            if (!cmd) return;
            addMessage(cmd, 'user');
            commandInput.value = '';
            commandExecuteBtn.disabled = true;
            const result = await executeDirectCommand(cmd);
            addMessage(result, 'system');
            commandExecuteBtn.disabled = false;
        }

        commandExecuteBtn.addEventListener('click', sendDirectCommand);
        commandInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendDirectCommand(); });

        loadConfig();
    </script>
</body>
</html>
